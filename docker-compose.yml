name: guessthebollysong 

services:
  db: 
    image: postgres:17-alpine 
    environment:
        POSTGRES_USER: gtbs 
        POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
        POSTGRES_DB: guessthebollysong 
    volumes:  
      - pgdata:/var/lib/postgresql/data 
    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtbs -d guessthebollysong"]
      interval: 5s 
      timeout: 10s 
      retries: 10 

  
  migrate:
    build:
      context: . 
      target: migrate 
    environment:
      DATABASE_URL: postgresql://gtbs:${DB_PASSWORD}@db:5432/guesthebollysong 
    depends_on:
      db:
        condition: service_healthy
    restart: "no"


  app:
    build:
      context: . 
      target: runner 
      args:
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://gtbs:${DB_PASSWORD}@db:5432/guessthebollysong
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      DEVICE_COOKIE_SECRET: ${DEVICE_COOKIE_SECRET:?set DEVICE_COOKIE_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata: